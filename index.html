<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buku Tabungan Kelas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<style>
:root{
  --bg:#EEF1F7;
  --surface:#FFFFFF;
  --surface-2:#F6F7FB;
  --ink:#242530;
  --ink-soft:#6C6D80;
  --line:#E1E4EC;

  --blue:#3B6FD6;    --blue-soft:#E3EBFC;
  --orange:#F2874B;  --orange-soft:#FDEADD;
  --purple:#8B5CF6;  --purple-soft:#EFE7FE;
  --pink:#EC6FA0;    --pink-soft:#FCE6EF;
  --gray:#6B7280;    --gray-soft:#E8E9ED;

  --radius-lg:22px; --radius-md:16px; --radius-sm:10px;
}
*{box-sizing:border-box}
html{ overflow-x:hidden; width:100%; }
body{ font-variant-numeric:tabular-nums; margin:0; font-family:'Inter',system-ui,sans-serif; background:var(--bg); color:var(--ink); min-height:100vh; overflow-x:hidden; width:100%; }
.table-scroll{ overflow-x:auto; -webkit-overflow-scrolling:touch; }
h1,h2,h3{font-family:'Inter',system-ui,sans-serif}
.mono{font-family:'Inter',system-ui,sans-serif; font-variant-numeric:tabular-nums}
.hidden{display:none !important}

.topbar{ display:flex; justify-content:space-between; align-items:center; padding:18px 22px; max-width:960px; margin:0 auto; }
.brand{display:flex; align-items:center; gap:10px}
.brand-mark{ width:36px; height:36px; border-radius:10px; background:var(--blue); display:flex; align-items:center; justify-content:center; }
.brand-mark svg{width:20px; height:20px; stroke:#fff}
.brand-text{font-family:'Inter'; font-weight:600; font-size:1.05rem}
.btn-ghost{ background:transparent; border:1.5px solid var(--line); color:var(--ink-soft); padding:8px 16px; border-radius:100px; font-size:.82rem; font-weight:600; cursor:pointer; font-family:'Inter'; display:flex; align-items:center; gap:6px; }
.btn-ghost:hover{border-color:var(--blue); color:var(--blue)}
.btn-ghost svg{width:15px; height:15px}

.wrap{max-width:960px; margin:0 auto; padding:18px 20px 100px}

.card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-lg); padding:20px; }
.card + .card{margin-top:16px}
.card h2{font-size:1.1rem; margin:0 0 4px; font-weight:600}
.card .desc{color:var(--ink-soft); font-size:.85rem; margin-bottom:16px}

input, textarea, select{ width:100%; padding:11px 14px; border-radius:var(--radius-sm); border:1.5px solid var(--line); background:var(--surface-2); color:var(--ink); font-size:.95rem; margin-bottom:10px; font-family:'Inter'; outline:none; }
input:focus, select:focus{border-color:var(--blue)}
button{font-family:'Inter'}
.btn{ background:var(--blue); color:#fff; border:none; padding:11px 18px; border-radius:100px; font-size:.92rem; font-weight:700; cursor:pointer; }
.btn:hover{filter:brightness(0.92)}
.btn.orange{background:var(--orange)}
.btn.purple{background:var(--purple)}
.btn.pink{background:var(--pink)}
.btn.gray{background:var(--gray)}
.btn.outline{background:transparent; border:1.5px solid var(--line); color:var(--ink)}
.btn.outline.active{border-color:var(--blue); color:var(--blue); background:var(--blue-soft)}
.btn.small{padding:7px 14px; font-size:.8rem; border-radius:100px}
.btn:disabled{opacity:.45; cursor:not-allowed}

.result-msg{ margin-top:10px; padding:12px 14px; border-radius:var(--radius-sm); font-size:.88rem; line-height:1.5; }
.result-msg.err{background:var(--pink-soft); color:#9c2a56; border:1px solid var(--pink)}
.result-msg.warn{background:var(--orange-soft); color:#8a4318; border:1px solid var(--orange)}

.spinner{ width:20px; height:20px; border:3px solid var(--line); border-top-color:var(--blue); border-radius:50%; margin:10px auto; animation:spin .7s linear infinite; }
@keyframes spin{ to{ transform:rotate(360deg);} }
.loading-text{color:var(--ink-soft); font-size:.88rem; text-align:center}

table{width:100%; border-collapse:collapse; font-size:.87rem; margin-top:6px}
th,td{padding:9px 8px; text-align:left; border-bottom:1px solid var(--line)}
th{color:var(--ink-soft); font-weight:600; font-size:.75rem; text-transform:uppercase; letter-spacing:.03em}
tfoot td{font-weight:700; border-top:2px solid var(--ink); border-bottom:none}
.pagination{display:flex; justify-content:space-between; align-items:center; margin-top:10px; gap:8px}
.pagination span{color:var(--ink-soft); font-size:.8rem}

.row{display:flex; gap:8px}
.row > *{flex:1}
.between{display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap}

.ortu-card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-lg); padding:30px 26px; max-width:420px; margin:8vh auto 0; text-align:center; }
.ortu-nama{font-family:'Inter'; font-size:1.3rem; font-weight:600; margin-bottom:18px; color:var(--blue)}
.saldo-label{color:var(--ink-soft); font-size:.85rem}
.saldo{font-family:'Inter'; font-size:2.1rem; font-weight:600; color:var(--purple); margin:4px 0 18px}
.info-box{ background:var(--surface-2); border:1px solid var(--line); border-radius:var(--radius-sm); padding:14px; text-align:left; font-size:.9rem; }
.info-box div{margin-bottom:6px}

.overlay{ position:fixed; inset:0; background:rgba(36,37,48,.55); display:flex; align-items:center; justify-content:center; padding:20px; z-index:50; }
.modal{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-lg); padding:24px; max-width:320px; width:100%; }

/* Bento beranda */
.bento-nav{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:18px; }
.bento-item{ border:1.5px solid var(--line); border-radius:var(--radius-md); padding:18px; cursor:pointer; text-align:left; display:flex; flex-direction:column; gap:12px; background:var(--surface); transition:transform .12s; }
.bento-item:hover{transform:translateY(-2px)}
.bento-item.input-edit{grid-column:span 2}
.bento-icon{ width:38px; height:38px; border-radius:10px; display:flex; align-items:center; justify-content:center; }
.bento-icon svg{width:19px; height:19px; stroke:#fff}
.bento-title{font-family:'Inter'; font-weight:600; font-size:.98rem}
.bento-sub{font-size:.78rem; color:var(--ink-soft)}
.bento-item.c-blue .bento-icon{background:var(--blue)}
.bento-item.c-orange .bento-icon{background:var(--orange)}
.bento-item.c-purple .bento-icon{background:var(--purple)}
.bento-item.c-pink .bento-icon{background:var(--pink)}
.bento-item.c-gray .bento-icon{background:var(--gray)}

@media (max-width:640px){
  .bento-nav{grid-template-columns:1fr 1fr}
  .bento-item.input-edit{grid-column:span 2}
}

/* Halaman detail */
.page-header{ display:flex; align-items:center; gap:12px; margin-bottom:16px; }
.page-icon{ width:40px; height:40px; border-radius:11px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.page-icon svg{width:20px; height:20px; stroke:#fff}
.page-title{font-size:1.2rem; font-weight:600; margin:0}

.siswa-row{ display:flex; align-items:center; gap:10px; padding:11px 0; border-bottom:1px solid var(--line); }
.siswa-row:last-child{border-bottom:none}
.siswa-info{flex:1; min-width:0}
.siswa-nama{font-weight:600; font-size:.92rem}
.siswa-meta{font-size:.78rem; color:var(--ink-soft)}
.siswa-input{width:130px; margin-bottom:0; text-align:right; font-family:'Inter'}
.siswa-status{width:26px; text-align:center; font-size:.85rem; font-weight:700}

.subnav{display:flex; gap:8px; margin-bottom:14px}
.banner-warn{ background:var(--orange-soft); border:1px solid var(--orange); color:#8a4318; padding:10px 14px; border-radius:var(--radius-sm); font-size:.85rem; margin-bottom:14px; }
.summary-line{margin-top:10px; font-size:.9rem; color:var(--ink-soft)}
.summary-line b{color:var(--ink)}

.toast{
  position:fixed; left:50%; bottom:84px; transform:translateX(-50%);
  background:var(--ink); color:#fff; padding:12px 14px 12px 18px; border-radius:14px;
  display:flex; align-items:center; gap:14px; font-size:.88rem; box-shadow:0 8px 24px rgba(0,0,0,.25);
  z-index:60; max-width:90vw;
}
.toast button{
  background:transparent; border:1.5px solid rgba(255,255,255,.35); color:#fff;
  padding:6px 12px; border-radius:100px; font-size:.8rem; font-weight:700; cursor:pointer; white-space:nowrap;
}
.toast button:hover{border-color:#fff}

.autocomplete-wrap{position:relative}
.ac-dropdown{
  position:absolute; top:100%; left:0; right:0; background:var(--surface); border:1px solid var(--line);
  border-radius:var(--radius-sm); margin-top:-6px; max-height:230px; overflow-y:auto; z-index:35;
  box-shadow:0 10px 26px rgba(0,0,0,.1);
}
.ac-item{ padding:10px 12px; font-size:.88rem; cursor:pointer; display:flex; justify-content:space-between; align-items:center; gap:8px; }
.ac-item:hover{background:var(--surface-2)}
.ac-item.ac-empty{color:var(--ink-soft); cursor:default}
.ac-item.ac-empty:hover{background:transparent}
.ac-absen{color:var(--ink-soft); font-size:.76rem; white-space:nowrap}
.filter-box{margin-bottom:4px}

/* ===== Gaya A: kartu + chip ===== */
.back{ width:36px; height:36px; border-radius:10px; border:1.5px solid var(--line); background:var(--surface); color:var(--ink); display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; padding:0 }
.back:hover{border-color:var(--blue); color:var(--blue)}
.back svg{width:18px; height:18px}
.bento-item.input-edit{ flex-direction:row; align-items:center; background:var(--blue); border-color:var(--blue); color:#fff }
.bento-item.input-edit .bento-icon{ background:rgba(255,255,255,.2) }
.bento-item.input-edit .bento-sub{ color:rgba(255,255,255,.85) }
.bento-item.input-edit > div:nth-child(2){ flex:1 }
.bento-chev{ width:20px; height:20px; stroke:#fff }
.chip{ position:relative; padding:7px 14px; border-radius:100px; border:1.5px solid var(--line); background:var(--surface); font-size:.85rem; font-weight:600; color:var(--ink-soft); cursor:pointer; font-family:'Inter'; display:inline-flex; align-items:center; gap:6px; white-space:nowrap }
.chip.on{ background:var(--blue); border-color:var(--blue); color:#fff }
.chip svg{ width:14px; height:14px }
.chip input[type=date]{ position:absolute; inset:0; width:100%; height:100%; opacity:0; margin:0; padding:0; cursor:pointer; border:none }
.tgl-chips{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:6px }
.tgl-sub{ font-size:.82rem; color:var(--ink-soft); margin-bottom:14px }
#page-input .card{ background:transparent; border:none; padding:0 }
.siswa-row{ background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:10px 12px; margin-bottom:8px }
.siswa-row:last-child{ border-bottom:1px solid var(--line) }
.siswa-row.lk{ opacity:.6 }
.av, .av-sm{ border-radius:50%; background:var(--blue-soft); color:var(--blue); display:flex; align-items:center; justify-content:center; font-weight:700; flex-shrink:0 }
.av{ width:34px; height:34px; font-size:.8rem }
.av-sm{ width:26px; height:26px; font-size:.7rem; background:var(--orange-soft); color:#B5551F }
.siswa-row.lk .av{ background:var(--gray-soft); color:var(--gray) }
.no-urut{ width:22px; text-align:center; color:var(--ink-soft); font-size:.8rem; font-weight:600; flex-shrink:0; margin-right:-2px }
.siswa-input.terisi{ border-color:var(--blue); background:#fff }
.ck{ width:18px; height:18px; stroke:var(--blue); fill:none; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; flex-shrink:0 }
.nm-av{ display:inline-flex; align-items:center; gap:8px }
.savebar{ position:fixed; bottom:18px; left:50%; transform:translateX(-50%); width:min(92vw,420px); background:var(--blue); color:#fff; border:none; border-radius:100px; padding:14px; font-weight:700; font-size:.95rem; box-shadow:0 8px 22px rgba(59,111,214,.38); z-index:40; cursor:pointer; display:flex; align-items:center; justify-content:center }
.savebar.kosong{ background:var(--gray); box-shadow:0 8px 22px rgba(0,0,0,.18) }
.savebar:disabled{ opacity:.6; cursor:not-allowed }
.stat-row{ display:flex; gap:8px; margin-top:12px }
.stat{ flex:1; background:var(--surface-2); border:1px solid var(--line); border-radius:14px; padding:12px }
.stat.warn{ background:var(--orange-soft); border-color:var(--orange); color:#8A4318 }
.stat-l{ font-size:.75rem; opacity:.8 }
.stat-v{ font-family:'Inter',system-ui,sans-serif; font-weight:600; font-size:1rem }
.rk{ display:flex; align-items:center; gap:12px; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:12px; margin-bottom:8px }
.rk1{ border-color:#EF9F27 }
.rk .no{ width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:700; flex-shrink:0 }
.rk-n{ flex:1; font-weight:600; min-width:0 }
.saldo-card{ background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:18px 12px; text-align:center; margin-top:10px }
.saldo-card .saldo{ margin:4px 0 0 }
#page-rekap .subnav .btn.outline, #page-saldo .subnav .btn.outline{ border-radius:100px; padding:7px 14px }
#page-rekap .subnav .btn.outline.active{ background:var(--orange-soft); border-color:var(--orange); color:#8A4318 }
#page-saldo .subnav .btn.outline.active{ background:var(--purple-soft); border-color:var(--purple); color:#5B3FB8 }
.field-label{ font-size:.78rem; color:var(--ink-soft); margin-bottom:4px }
.field-hint{ font-size:.78rem; color:var(--ink-soft); margin:-2px 0 12px }
[id^="btnSegarkan"]{ width:auto !important; padding:8px 10px !important; display:inline-flex; align-items:center; justify-content:center }
</style>
</head>
<body>

<div id="editRiwayatOverlay" class="overlay hidden">
  <div class="modal">

    <h2 style="margin-top:0">Edit Transaksi</h2>
    <div class="field-label">Tanggal</div>
    <input type="date" id="editRiwayatTanggal">
    <div class="field-label">Nominal</div>
    <input type="text" inputmode="numeric" id="editRiwayatInput" oninput="formatRibuan_(this)">
    <div class="field-hint">Isi 0 untuk menghapus transaksi ini.</div>
    <div class="row">
      <button class="btn pink" style="width:100%" id="btnSimpanEditRiwayat" onclick="simpanEditRiwayatModal()">Simpan</button>
      <button class="btn outline" style="width:100%" onclick="closeEditRiwayat()">Batal</button>
    </div>
    <div id="editRiwayatResult"></div>
  </div>
</div>

<div id="dashboard" class="wrap">

  <!-- ===== BERANDA (hanya shortcut) ===== -->
  <div id="page-home">
    <h1 style="margin-bottom:2px">Dashboard Admin</h1>
    <div class="desc" id="homeTanggal" style="color:var(--ink-soft);margin-bottom:18px"></div>
    <div class="bento-nav">
      <button class="bento-item input-edit c-blue" onclick="goToPage('input')">
        <div class="bento-icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></div>
        <div><div class="bento-title">Input Tabungan</div><div class="bento-sub">Catat tabungan per siswa</div></div>
        <svg class="bento-chev" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
      </button>
      <button class="bento-item c-orange" onclick="goToPage('rekap')">
        <div class="bento-icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="3" width="12" height="18" rx="2"/><path d="M9 3v3h6V3M9 12h6M9 16h4"/></svg></div>
        <div><div class="bento-title">Rekap</div><div class="bento-sub">Harian &amp; rentang tanggal</div></div>
      </button>
      <button class="bento-item c-purple" onclick="goToPage('saldo')">
        <div class="bento-icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/><circle cx="16" cy="14" r="1"/></svg></div>
        <div><div class="bento-title">Saldo</div><div class="bento-sub">Per siswa &amp; kelas</div></div>
      </button>
      <button class="bento-item c-pink" onclick="goToPage('riwayat')">
        <div class="bento-icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg></div>
        <div><div class="bento-title">Riwayat</div><div class="bento-sub">Transaksi per siswa</div></div>
      </button>
      <button class="bento-item c-gray" onclick="goToPage('ranking')">
        <div class="bento-icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4"/><path d="M7 4h10v5a5 5 0 0 1-10 0Z"/><path d="M7 6H4a3 3 0 0 0 3 4M17 6h3a3 3 0 0 1-3 4"/></svg></div>
        <div><div class="bento-title">Ranking</div><div class="bento-sub">Peringkat tabungan</div></div>
      </button>
    </div>
  </div>

  <!-- ===== HALAMAN: INPUT & EDIT ===== -->
  <div id="page-input" class="page hidden">
    <div class="page-header">
      <button class="back" onclick="goHome()" aria-label="Kembali ke beranda"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
      <div class="page-icon" style="background:var(--blue)"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></div>
      <h2 class="page-title">Input Tabungan</h2>
    </div>
    <div class="card">
      <div class="tgl-chips">
        <button class="chip on" id="chipToday" onclick="pilihTanggalHariIni_()">Hari ini</button>
        <button class="chip" id="chipYest" onclick="pilihTanggalKemarin_()">Kemarin</button>
        <label class="chip" id="chipCustom">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 11h18"/></svg>
          <span id="chipCustomLabel">Pilih tanggal</span>
          <input type="date" id="tglInputManual" onchange="gantiTanggalInput_()" onclick="bukaKalender_()" aria-label="Pilih tanggal transaksi">
        </label>
      </div>
      <div class="tgl-sub" id="tglInputSub"></div>
      <div id="warnTunggakan"></div>
      <button class="btn outline small" id="btnSegarkanInput" onclick="muatDaftarSiswa()" style="width:auto;margin-bottom:10px" title="Segarkan" aria-label="Segarkan"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 0 0-14.9-3M4 4v4h4"/><path d="M4 13a8 8 0 0 0 14.9 3M20 20v-4h-4"/></svg></button>
      <div id="daftarSiswaArea"><div class="loading-text">Memuat...</div></div>
    </div>
    <button id="btnSimpanSemua" class="savebar kosong" onclick="simpanSemua()"><span id="simpanLabel">Simpan</span></button>
  </div>

  <!-- ===== HALAMAN: REKAP ===== -->
  <div id="page-rekap" class="page hidden">
    <div class="page-header">
      <button class="back" onclick="goHome()" aria-label="Kembali ke beranda"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
      <div class="page-icon" style="background:var(--orange)"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="3" width="12" height="18" rx="2"/><path d="M9 3v3h6V3M9 12h6M9 16h4"/></svg></div>
      <h2 class="page-title">Rekap Transaksi</h2>
    </div>
    <div class="card">
      <div class="subnav">
        <button class="btn outline small active" data-rekapmode="harian" onclick="gantiRekapMode('harian')">Harian</button>
        <button class="btn outline small" data-rekapmode="rentang" onclick="gantiRekapMode('rentang')">Rentang Tanggal</button>
      </div>
      <div id="rekapHarianBox">
        <button class="btn small outline" id="btnSegarkanRekapHarian" onclick="rekapHarian()" title="Segarkan" aria-label="Segarkan"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 0 0-14.9-3M4 4v4h4"/><path d="M4 13a8 8 0 0 0 14.9 3M20 20v-4h-4"/></svg></button>
        <div id="areaRekapHarian"></div>
      </div>
      <div id="rekapRentangBox" class="hidden">
        <div class="row">
          <input type="date" id="tglMulai">
          <input type="date" id="tglAkhir">
        </div>
        <button class="btn orange" onclick="rekapRentang()">Tampilkan</button>
        <div id="areaRekapRentang"></div>
      </div>
    </div>
  </div>

  <!-- ===== HALAMAN: SALDO ===== -->

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbwfideU8IKAYMtBeh-0Q2ARl8KnmOGMYWjZcECpz-sQR2rRESIh7tEuiWJ1jjOIT0Sp/exec";

async function call(action, extra){
  const body = Object.assign({ action: action }, extra || {});
  const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify(body) });
  return res.json();
}
function rupiah(n){ return 'Rp ' + Number(n||0).toLocaleString('id-ID'); }
function showError(elId, text){
  document.getElementById(elId).innerHTML = '<div class="result-msg err">' + text + '</div>';
}
function showLoading(elId){
  document.getElementById(elId).innerHTML = '<div class="spinner"></div><div class="loading-text">Memuat...</div>';

let toastTimer = null;
function showUndoToast(pesan, onUndo){
  const container = document.getElementById('toastContainer');
  clearTimeout(toastTimer);
  container.innerHTML = `<div class="toast"><span>${pesan}</span><button id="btnUndoToast">Urungkan</button></div>`;
  document.getElementById('btnUndoToast').onclick = async () => {
    container.innerHTML = '';
    await onUndo();
  };
  toastTimer = setTimeout(() => { container.innerHTML = ''; }, 7000);
}
const NAMA_SEKOLAH_REKAP = 'SDN 6 TEJAKULA';
const BORDER_TIPIS_ = { style: 'thin' };
const BORDER_KOTAK_ = { top: BORDER_TIPIS_, bottom: BORDER_TIPIS_, left: BORDER_TIPIS_, right: BORDER_TIPIS_ };
const FORMAT_ANGKA_ = '[$-421]#,##0;-[$-421]#,##0';

async function unduhRekapExcel_(cfg){
  // cfg = { headerLabels, dataKeys, rows, total, topLabel, topValue, topIsDate,
  //         bottomLabel, bottomValue, bottomIsDate, filename, colWidths }
  const wb = new ExcelJS.Workbook();
  const ws = wb.addWorksheet('Rekap');
  const colCount = cfg.headerLabels.length;

  ws.mergeCells(1,1,1,colCount);
  const judul = ws.getCell(1,1);
  judul.value = 'REKAP TABUNGAN SISWA KELAS 3';
  judul.font = { bold:true, size:13 };
  judul.alignment = { horizontal:'center' };
  ws.getRow(1).height = 17;

  ws.mergeCells(2,1,2,colCount);
  const sekolah = ws.getCell(2,1);
  sekolah.value = NAMA_SEKOLAH_REKAP;
  sekolah.font = { bold:true, size:13 };
  sekolah.alignment = { horizontal:'center' };
  ws.getRow(2).height = 17;

  ws.getRow(3).height = 17; // baris kosong pemisah

  const kolLabelAtas = Math.max(1, colCount - 2);
  const cLabelAtas = ws.getCell(4, kolLabelAtas);
  cLabelAtas.value = cfg.topLabel;
  cLabelAtas.font = { bold:true };
  cLabelAtas.alignment = { horizontal:'right' };
  const cNilaiAtas = ws.getCell(4, kolLabelAtas + 1);
  cNilaiAtas.value = cfg.topValue;
  cNilaiAtas.font = { bold:true };
  cNilaiAtas.alignment = { horizontal:'left' };
  if (cfg.topIsDate) cNilaiAtas.numFmt = 'dd-mm-yyyy';

  const headerRow = 5;
  cfg.headerLabels.forEach((h,i)=>{
    const c = ws.getCell(headerRow, i+1);
    c.value = h;
    c.font = { bold:true };
    c.alignment = { horizontal:'center' };
    c.border = BORDER_KOTAK_;
  });

  let r = headerRow + 1;
  cfg.rows.forEach(row=>{
    cfg.dataKeys.forEach((key,i)=>{
      const c = ws.getCell(r, i+1);
      c.value = row[key];
      c.border = BORDER_KOTAK_;
      if (key === 'Nominal') c.numFmt = FORMAT_ANGKA_;
    });
    r++;
  });

  const kolLabelKanan = colCount - 1;

  for (let cc=1; cc<=colCount; cc++) ws.getCell(r,cc).border = BORDER_KOTAK_;
  ws.getCell(r, kolLabelKanan).value = 'Total';
  ws.getCell(r, kolLabelKanan).font = { bold:true };
  ws.getCell(r, kolLabelKanan).alignment = { horizontal:'right' };
  ws.getCell(r, colCount).value = cfg.total;
  ws.getCell(r, colCount).font = { bold:true, size:13 };
  ws.getCell(r, colCount).numFmt = FORMAT_ANGKA_;
  ws.getRow(r).height = 17;
  r++;

  for (let cc=1; cc<=colCount; cc++) ws.getCell(r,cc).border = BORDER_KOTAK_;
  ws.getCell(r, kolLabelKanan).value = cfg.bottomLabel;
  ws.getCell(r, kolLabelKanan).font = { bold:true };
  ws.getCell(r, kolLabelKanan).alignment = { horizontal:'right' };
  ws.getCell(r, colCount).value = cfg.bottomValue;
  ws.getCell(r, colCount).font = { bold:true };
  if (cfg.bottomIsDate) ws.getCell(r, colCount).numFmt = 'dd-mm-yyyy';
  r++;

  for (let cc=1; cc<=colCount; cc++) ws.getCell(r,cc).border = BORDER_KOTAK_;
  ws.getCell(r, kolLabelKanan).value = 'Paraf';
  ws.getCell(r, kolLabelKanan).font = { bold:true };
  ws.getCell(r, kolLabelKanan).alignment = { horizontal:'right', vertical:'center' };
  ws.getRow(r).height = 30;

  cfg.colWidths.forEach((w,i)=>{ ws.getColumn(i+1).width = w; });

  const buffer = await wb.xlsx.writeBuffer();
  const blob = new Blob([buffer], { type:'application/octet-stream' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = cfg.filename + '.xlsx';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

async function downloadSaldoExcel(rows, headers, total, tanggalLabel, filename){
  const wb = new ExcelJS.Workbook();
  const ws = wb.addWorksheet('Saldo');
  const colCount = headers.length;
  ws.mergeCells(1,1,1,colCount);
  const judul = ws.getCell(1,1);
  judul.value = 'Saldo Tabungan Siswa Kelas 3';
  judul.font = { bold:true, size:14 };
  judul.alignment = { horizontal:'center' };
  ws.mergeCells(2,1,2,colCount);
  const tglCell = ws.getCell(2,1);
  tglCell.value = tanggalLabel;
  tglCell.alignment = { horizontal:'center' };
  tglCell.font = { italic:true };
  const headerRow = 4;
  headers.forEach((h,i)=>{ const c = ws.getCell(headerRow, i+1); c.value = h; c.font = { bold:true }; });
  let r = headerRow + 1;
  rows.forEach(row=>{ headers.forEach((h,i)=>{ ws.getCell(r, i+1).value = row[h]; }); r++; });
  ws.mergeCells(r,1,r,colCount-1);
  ws.getCell(r,1).value = 'Total';
  ws.getCell(r,1).font = { bold:true };
  ws.getCell(r,colCount).value = total;
  ws.getCell(r,colCount).font = { bold:true };
  ws.columns.forEach(c => { c.width = 20; });
  const buffer = await wb.xlsx.writeBuffer();
  const blob = new Blob([buffer], { type:'application/octet-stream' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename + '.xlsx';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

  el.value = raw ? Number(raw).toLocaleString('id-ID') : '';
}
function angkaMentah_(el){
  return el.value.replace(/\./g, '').replace(/\D/g, '');

async function konfirmasiSudahSetor(saldoBelumSetor){

    setTimeout(() => { btnEl.textContent = asal; }, 1500);
  });

/* ---- Tanggal input: chip Hari ini / Kemarin / Pilih tanggal ---- */
let tanggalManual = false;
function isoDari_(d){
  const p = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate());
}
function hariIniISO_(){ return isoDari_(new Date()); }
function kemarinISO_(){ const d = new Date(); d.setDate(d.getDate()-1); return isoDari_(d); }
function tglDariISO_(iso){ const [y,m,d] = iso.split('-').map(Number); return new Date(y, m-1, d); }
function labelTanggal_(iso){
  return tglDariISO_(iso).toLocaleDateString('id-ID', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
}
function labelSingkat_(iso){
  return tglDariISO_(iso).toLocaleDateString('id-ID', { day:'numeric', month:'short' });
}
function inisial_(nama){
  return String(nama || '').trim().split(/\s+/).slice(0,2).map(w => w[0]).join('').toUpperCase();
}
// Kosong = pakai hari ini (server yang menentukan); berisi = tanggal manual (yyyy-mm-dd)
function getTanggalInput_(){
  if (!tanggalManual) return '';
  return document.getElementById('tglInputManual').value || '';
}
function renderTanggalInput_(){
  const inp = document.getElementById('tglInputManual');
  inp.max = hariIniISO_();
  if (!tanggalManual) inp.value = hariIniISO_();
  const iso = inp.value || hariIniISO_();
  const mode = !tanggalManual ? 'today' : (iso === kemarinISO_() ? 'yesterday' : 'custom');
  document.getElementById('chipToday').classList.toggle('on', mode === 'today');
  document.getElementById('chipYest').classList.toggle('on', mode === 'yesterday');
  document.getElementById('chipCustom').classList.toggle('on', mode === 'custom');
  document.getElementById('chipCustomLabel').textContent = mode === 'custom' ? labelSingkat_(iso) : 'Pilih tanggal';
  document.getElementById('tglInputSub').textContent = labelTanggal_(iso) + (tanggalManual ? ' \u00b7 mode manual' : '');
}
function resetTanggalInput_(){
  tanggalManual = false;
  renderTanggalInput_();
}
function pilihTanggalHariIni_(){
  if (!tanggalManual) return;
  tanggalManual = false;
  renderTanggalInput_();
  muatDaftarSiswa();
}
function pilihTanggalKemarin_(){
  document.getElementById('tglInputManual').value = kemarinISO_();
  tanggalManual = true;
  renderTanggalInput_();
  muatDaftarSiswa();
}
function bukaKalender_(){
  const inp = document.getElementById('tglInputManual');
  try {
    if (typeof inp.showPicker === 'function') inp.showPicker();
    else inp.focus();
  } catch(e){ inp.focus(); }
}
function gantiTanggalInput_(){
  const inp = document.getElementById('tglInputManual');
  if (!inp.value) return;
  tanggalManual = inp.value !== hariIniISO_();
  renderTanggalInput_();
  muatDaftarSiswa();
}
// Ringkasan di tombol simpan: jumlah siswa + total nominal yang akan disimpan
function updateRingkasanSimpan_(){
  let n = 0, total = 0;
  document.querySelectorAll('#daftarSiswaArea .siswa-row[data-absen] .siswa-input').forEach(inp => {
    const v = Number(angkaMentah_(inp)) || 0;
    inp.classList.toggle('terisi', v > 0);
    if (v > 0){ n++; total += v; }
  });
  const btn = document.getElementById('btnSimpanSemua');
  const lbl = document.getElementById('simpanLabel');
  if (lbl) lbl.textContent = n ? 'Simpan ' + n + ' transaksi \u00b7 ' + rupiah(total) : 'Simpan';
  btn.classList.toggle('kosong', !n);
}

// Mode tanggal manual: daftar siswa + transaksi pada tanggal tsb (tanpa bergantung pada listSiswaHariIni)
async function muatDaftarManual_(tgl){
  daftarSiswaCache = null;
  const [list, rek] = await Promise.all([
    getDaftarSiswaCache(),
    call('rekapRentang', { tglMulai: tgl, tglAkhir: tgl })
  ]);
  if (!list.length){ daftarSiswaCache = null; return { ok:false, pesan:'Gagal memuat daftar siswa.' }; }
  if (!rek.ok) return rek;
  const perAbsen = {};
  (rek.transaksi || []).forEach(x => {
    const k = String(x.absen);
    perAbsen[k] = (perAbsen[k] || 0) + Number(x.nominal || 0);
  });
  return {
    ok: true, diblokir: false,
    list: list.map(s => ({ absen: s.absen, nama: s.nama, nominalHariIni: perAbsen[String(s.absen)] || 0 }))
  };
}
// Simpan dengan tanggal manual: satu transaksi per siswa pada tanggal terpilih (4 request paralel)
async function simpanTanggalManual_(daftar, tgl){
  const list = await getDaftarSiswaCache();
  const namaByAbsen = {};
  list.forEach(s => { namaByAbsen[String(s.absen)] = s.nama; });
  let sukses = 0; const gagal = [];
  for (let i = 0; i < daftar.length; i += 4){
    const batch = daftar.slice(i, i + 4);
    await Promise.all(batch.map(async item => {
      const nama = namaByAbsen[String(item.absen)] || '';
      try {
        const r = await call('restoreTransaksi', { absen: item.absen, nama: nama, tanggal: tgl, nominal: item.nominal });
        if (r && r.ok === false) gagal.push((nama || 'Absen ' + item.absen) + ': ' + (r.pesan || 'gagal'));
        else sukses++;
      } catch(err){ gagal.push((nama || 'Absen ' + item.absen) + ': ' + err.message); }
    }));
  }
  return { ok:true, sukses: sukses, gagal: gagal };
}

let daftarSiswaLoadedOnce = false;
async function muatDaftarSiswa(){
  const area = document.getElementById('daftarSiswaArea');
  const warn = document.getElementById('warnTunggakan');
  const btn = document.getElementById('btnSegarkanInput');
  if (daftarSiswaLoadedOnce){
    setTombolLoading(btn, true);
  } else {
    area.innerHTML = '<div class="spinner"></div><div class="loading-text">Memuat daftar siswa...</div>';
    warn.innerHTML = '';
  }
  try {
    const tgl = getTanggalInput_();
    const r = tgl ? await muatDaftarManual_(tgl) : await call('listSiswaHariIni');
    if (daftarSiswaLoadedOnce) setTombolLoading(btn, false);
    daftarSiswaLoadedOnce = true;
    warn.innerHTML = '';
    if (!r.ok){ area.innerHTML = '<div class="result-msg err">' + r.pesan + '</div>'; return; }

    if (r.diblokir){
      const kalimat = 'Saya sudah menyetor tabungan ke bendahara sejumlah ' + rupiah(r.saldoBelumSetor);
      area.innerHTML = '';
      warn.innerHTML = `
        <div class="banner-warn">
          <div style="margin-bottom:10px">Input ditutup sementara. Masih ada saldo belum disetor ke bendahara: <b>${rupiah(r.saldoBelumSetor)}</b>.</div>
          <div style="background:#fff;border:1px solid var(--orange);border-radius:10px;padding:10px 12px;margin-bottom:10px;font-style:italic">"${kalimat}"</div>
          <div class="row">
            <button class="btn small outline" onclick="salinKalimat_('${kalimat.replace(/'/g, "\\'")}', this)">Salin Kalimat</button>
            <button class="btn small orange" id="btnKonfirmasiSetor" onclick="konfirmasiSudahSetor(${r.saldoBelumSetor})">Saya Sudah Setor, Buka Input</button>
          </div>
        </div>`;
      return;
    }

    area.innerHTML = r.list.map((s, idx) => {
      const av = '<div class="no-urut">' + (idx + 1) + '</div><div class="av">' + inisial_(s.nama) + '</div>';
      if (s.nominalHariIni > 0){
        return `<div class="siswa-row lk">${av}<div class="siswa-info"><div class="siswa-nama">${s.nama}</div></div><input type="text" class="siswa-input mono" value="${s.nominalHariIni.toLocaleString('id-ID')}" disabled><svg class="ck" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg></div>`;
      }
      return `<div class="siswa-row" data-absen="${s.absen}">${av}<div class="siswa-info"><div class="siswa-nama">${s.nama}</div></div><input type="text" inputmode="numeric" class="siswa-input" value="0" onfocus="this.select()" oninput="formatRibuan_(this);updateRingkasanSimpan_()"></div>`;
    }).join('');
    updateRingkasanSimpan_();
  } catch(err){
    if (btn.disabled) setTombolLoading(btn, false);
    area.innerHTML = '<div class="result-msg err">Gagal memuat: ' + err.message + '</div>';
  }
}

async function simpanSemua(){
  const rows = document.querySelectorAll('#daftarSiswaArea .siswa-row[data-absen]');
  const fab = document.getElementById('btnSimpanSemua');
  const daftar = [];
  rows.forEach(row => {
    const input = row.querySelector('.siswa-input');
    const nominal = angkaMentah_(input);
    if (nominal && Number(nominal) > 0) daftar.push({ absen: row.dataset.absen, nominal: nominal });
  });
  if (!daftar.length){ alert('Belum ada nominal yang diisi.'); return; }
  const tgl = getTanggalInput_();
  if (tanggalManual && !tgl){ alert('Pilih tanggal transaksi dulu.'); return; }

  const asalIsi = fab.innerHTML;
  fab.disabled = true;
  fab.innerHTML = '<span class="spinner" style="width:20px;height:20px;margin:0;border-color:rgba(255,255,255,.4);border-top-color:#fff"></span>';

  try {
    const r = tgl ? await simpanTanggalManual_(daftar, tgl) : await call('simpanBanyakTransaksi', { items: daftar });
    fab.disabled = false;
    fab.innerHTML = asalIsi;
    if (!r.ok){ alert(r.pesan || 'Gagal menyimpan.'); return; }
    let pesan = 'Berhasil menyimpan ' + r.sukses + ' dari ' + daftar.length + ' transaksi' + (tgl ? ' (tanggal ' + labelTanggal_(tgl) + ')' : '') + '.';
    if (r.gagal && r.gagal.length) pesan += '\n\nGagal:\n' + r.gagal.join('\n');
    alert(pesan);
    muatDaftarSiswa();
  } catch(err){
    fab.disabled = false;
    fab.innerHTML = asalIsi;
    alert('Gagal terhubung ke server: ' + err.message);
  }
}

/* ---- D. Riwayat ---- */
let daftarSiswaCache = null;
async function getDaftarSiswaCache(){
  if (daftarSiswaCache) return daftarSiswaCache;
  const r = await call('listSiswa');
  daftarSiswaCache = r.ok ? r.list : [];
  return daftarSiswaCache;
}

// Live search generik: ketik nama -> muncul dropdown -> klik untuk pilih
function attachLiveSearch(inputEl, dropdownEl, onSelect, onTyping){
  inputEl.addEventListener('input', async () => {
    if (onTyping) onTyping();
    const q = inputEl.value.trim().toLowerCase();
    if (!q){ dropdownEl.classList.add('hidden'); dropdownEl.innerHTML = ''; return; }
    const list = await getDaftarSiswaCache();
    const matches = list.filter(s => s.nama.toLowerCase().includes(q)).slice(0, 8);
    if (!matches.length){
      dropdownEl.innerHTML = '<div class="ac-item ac-empty">Nama tidak ditemukan</div>';
      dropdownEl.classList.remove('hidden');
      return;
    }
    dropdownEl.innerHTML = matches.map(s =>
      `<div class="ac-item" data-absen="${s.absen}" data-nama="${s.nama}"><span>${s.nama}</span><span class="ac-absen">Absen ${s.absen}</span></div>`
    ).join('');
    dropdownEl.classList.remove('hidden');
    dropdownEl.querySelectorAll('.ac-item[data-absen]').forEach(item => {
      item.onclick = () => {
        onSelect(item.dataset.absen, item.dataset.nama);
        dropdownEl.classList.add('hidden');
      };
    });
  });
  document.addEventListener('click', (e) => {
    if (!inputEl.contains(e.target) && !dropdownEl.contains(e.target)) dropdownEl.classList.add('hidden');
  });
}

// Filter tabel yang sudah ditampilkan (Rekap & Saldo Kelas) berdasarkan nama, live saat mengetik
function filterTabel(inputEl, containerId){
  const q = inputEl.value.trim().toLowerCase();
  const container = document.getElementById(containerId);
  const rows = container.querySelectorAll('table tbody tr');
  rows.forEach(row => {
    row.style.display = row.textContent.toLowerCase().includes(q) ? '' : 'none';
  });
}

let riwayatAdminAbsen = '';
let riwayatAdminNama = '';
let riwayatAdminData = [];

let selectedAbsenRiwayat = '';
async function cekRiwayatAdmin(){
  const raw = document.getElementById('absenRiwayat').value.trim();
  const absen = selectedAbsenRiwayat || raw.replace(/\D/g, '');
  if (!absen){ showError('areaRiwayatAdmin', 'Ketik nama siswa lalu pilih dari daftar, atau isi nomor absen langsung.'); return; }
  riwayatAdminAbsen = absen;
  showLoading('areaRiwayatAdmin');
  const r = await call('riwayat', { absen: absen });
  if (!r.ok){ showError('areaRiwayatAdmin', r.pesan); return; }
  riwayatAdminNama = r.nama;
  riwayatAdminData = r.riwayat;
  renderRiwayatAdmin_(r.nama, r.riwayat);
}
function renderRiwayatAdmin_(nama, riwayat){
  document.getElementById('areaRiwayatAdmin').innerHTML = `
    <div class="summary-line" style="margin-top:10px">Nama: <b>${nama}</b></div>
    <table>
      <thead><tr><th>No</th><th>Tanggal</th><th style="text-align:right">Nominal</th><th></th></tr></thead>
      <tbody>${riwayat.map((x,i) => `
        <tr>
          <td>${i+1}</td>
          <td>${x.tanggal}</td>
          <td class="mono" style="text-align:right">${rupiah(x.nominal)}</td>
          <td style="text-align:center">
            <button class="btn small outline" style="padding:6px 9px" onclick="openEditRiwayat(${x.rowNumber}, ${x.nominal}, '${x.tanggalISO}')" title="Edit">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;vertical-align:middle"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
            </button>
          </td>
        </tr>`).join('') || '<tr><td colspan="4">Belum ada riwayat.</td></tr>'}</tbody>
    </table>`;
}

let editRiwayatRowNumber = null;
function openEditRiwayat(rowNumber, nominalSaatIni, tanggalISO){
  editRiwayatRowNumber = rowNumber;
  const input = document.getElementById('editRiwayatInput');
  input.value = Number(nominalSaatIni).toLocaleString('id-ID');
  document.getElementById('editRiwayatTanggal').value = tanggalISO;
  document.getElementById('editRiwayatResult').innerHTML = '';
  document.getElementById('editRiwayatOverlay').classList.remove('hidden');
}
function closeEditRiwayat(){ document.getElementById('editRiwayatOverlay').classList.add('hidden'); }
async function simpanEditRiwayatModal(){
  const input = document.getElementById('editRiwayatInput');
  const tanggal = document.getElementById('editRiwayatTanggal').value;
  const nominal = angkaMentah_(input);
  const rowNumber = editRiwayatRowNumber;
  const btn = document.getElementById('btnSimpanEditRiwayat');
  if (nominal === ''){ document.getElementById('editRiwayatResult').innerHTML = '<div class="result-msg err">Isi nominal dulu (isi 0 untuk menghapus transaksi ini).</div>'; return; }
  const nominalNum = Number(nominal);

  // Simpan data lama (sebelum diubah) untuk keperluan undo
  const entriLama = riwayatAdminData.find(x => x.rowNumber === rowNumber);

  const asalTombol = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner" style="width:16px;height:16px;margin:0;border-color:rgba(255,255,255,.4);border-top-color:#fff"></span>';
  try {
    let r;
    if (nominalNum === 0){
      r = await call('hapusTransaksiRow', { rowNumber: rowNumber });
      if (r.ok){
        closeEditRiwayat(); cekRiwayatAdmin();
        if (entriLama){
          showUndoToast('Transaksi tanggal ' + entriLama.tanggal + ' dihapus.', async () => {
            await call('restoreTransaksi', {
              absen: riwayatAdminAbsen, nama: riwayatAdminNama,
              tanggal: entriLama.tanggalISO, nominal: entriLama.nominal
            });
            cekRiwayatAdmin();
          });
        }
      } else {
        document.getElementById('editRiwayatResult').innerHTML = '<div class="result-msg err">' + r.pesan + '</div>';
      }
    } else {
      r = await call('editTransaksiRow', { rowNumber: rowNumber, nominal: nominal, tanggal: tanggal });
      if (r.ok){
        closeEditRiwayat(); cekRiwayatAdmin();
        if (entriLama){
          showUndoToast('Transaksi diperbarui.', async () => {
            await call('editTransaksiRow', {
              rowNumber: rowNumber, nominal: entriLama.nominal, tanggal: entriLama.tanggalISO
            });
            cekRiwayatAdmin();
          });
        }
      } else {
        document.getElementById('editRiwayatResult').innerHTML = '<div class="result-msg err">' + r.pesan + '</div>';
      }
    }
  } catch(err){
    document.getElementById('editRiwayatResult').innerHTML = '<div class="result-msg err">Gagal: ' + err.message + '</div>';
  }
  btn.disabled = false;
  btn.innerHTML = asalTombol;
}

async function ranking(){
  const btn = document.getElementById('btnSegarkanRanking');
  if (rankingLoaded) setTombolLoading(btn, true);
  else showLoading('areaRanking');

  let r;
  try {
    r = await call('ranking');
  } catch(err){
    if (btn.disabled) setTombolLoading(btn, false);
    showError('areaRanking', 'Gagal terhubung ke server: ' + err.message);
    return;
  }
  if (rankingLoaded) setTombolLoading(btn, false);
  if (!r.ok){ showError('areaRanking', r.pesan); return; }
  rankingLoaded = true;
  const medali = ['#FAEEDA;color:#633806', '#E8E9ED;color:#444441', '#FAECE7;color:#712B13'];
  document.getElementById('areaRanking').innerHTML = r.ranking.slice(0,3).map((x,i) =>
    `<div class="rk ${i === 0 ? 'rk1' : ''}"><div class="no" style="background:${medali[i]}">${i+1}</div><div class="rk-n">${x.nama}</div><div class="mono">${rupiah(x.total)}</div></div>`
  ).join('') || '<div class="desc">Belum ada data.</div>';
}

attachLiveSearch(

renderTanggalInput_();
goHome();
